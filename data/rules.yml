version: "3.1"

rules:
- rule: Say hello anytime the user says hello
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Thank anytime the user says thank you
  steps:
  - intent: thank
  - action: utter_thank

- rule: Out-of-scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope